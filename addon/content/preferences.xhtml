<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<groupbox
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })"
>
  <html:h2 data-l10n-id="pref-title"></html:h2>

  <!-- Mode -->
  <hbox align="center">
    <label value="Mode" />
    <menulist id="zotero-prefpane-__addonRef__-mode" preference="mode">
      <menupopup>
        <menuitem value="github" label="GitHub" />
        <menuitem value="supabase" label="Supabase" />
      </menupopup>
    </menulist>
  </hbox>

  <separator class="thin" />

  <!-- GitHub Settings -->
  <vbox id="__addonRef__-github-settings" flex="1">
    <html:h3 data-l10n-id="pref-github-title"></html:h3>
    <hbox align="center">
      <html:label
        for="zotero-prefpane-__addonRef__-githubRepo"
        data-l10n-id="pref-github-repo"
      ></html:label>
      <html:input
        id="zotero-prefpane-__addonRef__-githubRepo"
        type="text"
        preference="githubRepo"
      ></html:input>
    </hbox>
    <hbox align="center">
      <html:label
        for="zotero-prefpane-__addonRef__-githubToken"
        data-l10n-id="pref-github-token"
      ></html:label>
      <html:input
        id="zotero-prefpane-__addonRef__-githubToken"
        type="password"
        preference="githubToken"
      ></html:input>
    </hbox>
    <hbox align="center">
      <html:label
        for="zotero-prefpane-__addonRef__-githubBranch"
        data-l10n-id="pref-github-branch"
      ></html:label>
      <html:input
        id="zotero-prefpane-__addonRef__-githubBranch"
        type="text"
        preference="githubBranch"
      ></html:input>
    </hbox>
    <hbox align="center">
      <html:label
        for="zotero-prefpane-__addonRef__-githubContentPath"
        data-l10n-id="pref-github-content-path"
      ></html:label>
      <html:input
        id="zotero-prefpane-__addonRef__-githubContentPath"
        type="text"
        preference="githubContentPath"
      ></html:input>
    </hbox>
  </vbox>

  <!-- Supabase Settings -->
  <vbox id="__addonRef__-supabase-settings" flex="1" hidden="true">
    <html:h3 data-l10n-id="pref-supabase-title"></html:h3>
    <hbox align="center">
      <html:label
        for="zotero-prefpane-__addonRef__-supabaseUrl"
        data-l10n-id="pref-supabase-url"
      ></html:label>
      <html:input
        id="zotero-prefpane-__addonRef__-supabaseUrl"
        type="text"
        preference="supabaseUrl"
      ></html:input>
    </hbox>
    <hbox align="center">
      <html:label
        for="zotero-prefpane-__addonRef__-supabaseKey"
        data-l10n-id="pref-supabase-key"
      ></html:label>
      <html:input
        id="zotero-prefpane-__addonRef__-supabaseKey"
        type="password"
        preference="supabaseKey"
      ></html:input>
    </hbox>
    <hbox align="center">
      <html:label
        for="zotero-prefpane-__addonRef__-supabaseTable"
        data-l10n-id="pref-supabase-table"
      ></html:label>
      <html:input
        id="zotero-prefpane-__addonRef__-supabaseTable"
        type="text"
        preference="supabaseTable"
      ></html:input>
    </hbox>
    <hbox align="center">
      <html:label
        for="zotero-prefpane-__addonRef__-shareBaseUrl"
        data-l10n-id="pref-share-base-url"
      ></html:label>
      <html:input
        id="zotero-prefpane-__addonRef__-shareBaseUrl"
        type="text"
        preference="shareBaseUrl"
      ></html:input>
    </hbox>
    <description id="__addonRef__-share-url-hint"></description>
    <checkbox
      id="zotero-prefpane-__addonRef__-copyShareUrl"
      preference="copyShareUrl"
      data-l10n-id="pref-copy-share-url"
    />
  </vbox>

  <separator class="thin" />

  <!-- Export Options -->
  <html:h3 data-l10n-id="pref-export-title"></html:h3>

  <!-- Export Scope -->
  <hbox align="center">
    <html:label
      for="zotero-prefpane-__addonRef__-exportScope"
      data-l10n-id="pref-export-scope"
    ></html:label>
    <menulist id="zotero-prefpane-__addonRef__-exportScope" preference="exportScope">
      <menupopup>
        <menuitem value="collection" data-l10n-id="pref-export-scope-collection" />
        <menuitem value="collectionRecursive" data-l10n-id="pref-export-scope-recursive" />
        <menuitem value="library" data-l10n-id="pref-export-scope-library" />
      </menupopup>
    </menulist>
  </hbox>
  <description id="__addonRef__-export-scope-hint"></description>

  <!-- Zotero Group ID -->
  <hbox align="center">
    <html:label
      for="zotero-prefpane-__addonRef__-groupID"
      data-l10n-id="pref-group-id"
    ></html:label>
    <html:input
      id="zotero-prefpane-__addonRef__-groupID"
      type="text"
      preference="groupID"
    ></html:input>
  </hbox>
  <description id="__addonRef__-group-id-hint"></description>

  <!-- Fixed Share Slug -->
  <hbox align="center">
    <html:label
      for="zotero-prefpane-__addonRef__-fixedShareSlug"
      data-l10n-id="pref-fixed-slug"
    ></html:label>
    <html:input
      id="zotero-prefpane-__addonRef__-fixedShareSlug"
      type="text"
      preference="fixedShareSlug"
    ></html:input>
  </hbox>
  <description id="__addonRef__-fixed-slug-hint"></description>

  <checkbox
    id="zotero-prefpane-__addonRef__-includeNotes"
    preference="includeNotes"
    data-l10n-id="pref-include-notes"
  />

  <hbox align="center">
    <label value="Status Source" />
    <menulist id="zotero-prefpane-__addonRef__-statusField" preference="statusField">
      <menupopup>
        <menuitem value="collection" label="Collection Path" />
        <menuitem value="library" label="Library Name" />
      </menupopup>
    </menulist>
  </hbox>
  <description id="__addonRef__-status-hint"></description>

  <separator class="thin" />

  <!-- Sync Profile -->
  <html:h3 data-l10n-id="pref-sync-profile-title"></html:h3>
  <hbox align="center">
    <html:label
      for="zotero-prefpane-__addonRef__-syncProfile"
      data-l10n-id="pref-sync-profile"
    ></html:label>
    <menulist id="zotero-prefpane-__addonRef__-syncProfile" preference="syncProfile">
      <menupopup>
        <menuitem value="static" data-l10n-id="pref-sync-profile-static" />
        <menuitem value="collaborative" data-l10n-id="pref-sync-profile-collaborative" />
      </menupopup>
    </menulist>
  </hbox>
  <description id="__addonRef__-sync-profile-hint"></description>

  <!-- Collaboration Settings (shown when syncProfile = collaborative) -->
  <vbox id="__addonRef__-collaboration-settings" flex="1" hidden="true">
    <html:h3 data-l10n-id="pref-collaboration-title"></html:h3>

    <hbox align="center">
      <html:label
        for="zotero-prefpane-__addonRef__-collaborationPollInterval"
        data-l10n-id="pref-poll-interval"
      ></html:label>
      <html:input
        id="zotero-prefpane-__addonRef__-collaborationPollInterval"
        type="number"
        preference="collaborationPollInterval"
      ></html:input>
    </hbox>
    <description id="__addonRef__-poll-interval-hint"></description>

    <hbox align="center">
      <html:label
        for="zotero-prefpane-__addonRef__-supabaseActionsTable"
        data-l10n-id="pref-actions-table"
      ></html:label>
      <html:input
        id="zotero-prefpane-__addonRef__-supabaseActionsTable"
        type="text"
        preference="supabaseActionsTable"
      ></html:input>
    </hbox>

    <html:h4 data-l10n-id="pref-collection-names-title"></html:h4>

    <hbox align="center">
      <html:label
        for="zotero-prefpane-__addonRef__-pendingCollectionName"
        data-l10n-id="pref-pending-collection"
      ></html:label>
      <html:input
        id="zotero-prefpane-__addonRef__-pendingCollectionName"
        type="text"
        preference="pendingCollectionName"
      ></html:input>
    </hbox>

    <hbox align="center">
      <html:label
        for="zotero-prefpane-__addonRef__-claimedCollectionName"
        data-l10n-id="pref-claimed-collection"
      ></html:label>
      <html:input
        id="zotero-prefpane-__addonRef__-claimedCollectionName"
        type="text"
        preference="claimedCollectionName"
      ></html:input>
    </hbox>

    <hbox align="center">
      <html:label
        for="zotero-prefpane-__addonRef__-reportedCollectionName"
        data-l10n-id="pref-reported-collection"
      ></html:label>
      <html:input
        id="zotero-prefpane-__addonRef__-reportedCollectionName"
        type="text"
        preference="reportedCollectionName"
      ></html:input>
    </hbox>

    <separator class="thin" />

    <hbox align="center">
      <html:label
        for="zotero-prefpane-__addonRef__-defaultSharePassword"
        data-l10n-id="pref-default-password"
      ></html:label>
      <html:input
        id="zotero-prefpane-__addonRef__-defaultSharePassword"
        type="password"
        preference="defaultSharePassword"
      ></html:input>
    </hbox>
    <description id="__addonRef__-default-password-hint"></description>
  </vbox>
</groupbox>
<vbox>
  <html:label
    data-l10n-id="pref-help"
    data-l10n-args='{"time": "__buildTime__","name": "__addonName__","version":"__buildVersion__"}'
  ></html:label>
</vbox>
